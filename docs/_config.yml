title: Rimrooms — Async Industries
description: A company-management campaign for RimWorld about contract work beyond a gate.

# ==============================================================================================
# THIS REPOSITORY IS NEVER DEPLOYED. THIS FILE IS NOT A DEPLOY CONFIGURATION ANY MORE.
#
# Owner direction, 2026-10-05, verbatim: "the only page deploy will be on the new github mod and
# wiki and public docs ONLY!!!", with "supper seeding rules that only the mod and public docs go
# into the new mod repo as the deployable repo for the wiki".
#
# So the 2026-10-01 answer "docs/ root on this repo, github.io for now" is SUPERSEDED. Pages on
# this repository returns 404 and has never been enabled. The published wiki is pre-rendered
# static HTML in the public mod repository, built by tools/render-wiki-html.py from docs/wiki/.
#
# WHY THIS FILE STILL EXISTS, AND WHY NOTHING WAS DELETED
#
# Owner, same day: "without losing capability and functioning and documentiaons". Nothing here was
# removed. `title` and `description` are read by the static renderer, so they are live. The layout,
# the include and the front door still work and are still maintained.
#
# And the exclude list below now has exactly ONE job, which is worth more than the deploy it was
# written for: **if Pages were ever switched on for this repository by mistake, that list is the
# only thing standing between the mis-click and the work ledger.** Deleting it would save nothing
# and would remove the guard. tools/check-doc-conformance.py refuses any document that tells a
# reader to deploy Pages from here, so the rule is enforced rather than written down.
# ==============================================================================================

# NO REMOTE THEME, DELIBERATELY.
#
# Owner direction: "the beautiful and masterfully way paossible so the thing needs to NOT pop
# like a text wall". `jekyll-theme-primer` was here and the queue row's reading of it was blunt
# and right: a text wall with a margin. One column, one type size, and no way into a page except
# reading it from the top.
#
# `_layouts/default.html` and `assets/css/rimrooms.css` are ours now. Two things follow. The
# published site no longer depends on a remote gem resolving at build time, which is the same
# instinct as the package depending on nothing but Core. And the layout can carry the
# scannability the row asks for, because the row says it is "a layout answer as much as a prose
# one": a persistent index of every page, a summary line at the top of each, and a prose column
# narrow enough to read.

# The wiki is the published site. Everything else under docs/ is project working material and is
# excluded by the generated list below.
#
# THE WORK LEDGER IS NEVER PUBLISHED, AND UNTIL 0.12.93-dev THIS FILE ONLY SAID SO.
#
# The four lines that used to be here named `implementation`, `research`, `evidence` and
# `reviews` -- and two of those four do not exist. **Jekyll publishes every entry in its source
# directory that it is not told to exclude**, and fifty-four documents sit at docs/ root, with
# `TODO.md`, `NOW.md`, `FINALIZED.md` and `DECOMPOSED.md` among them. None of them carries front
# matter, so Jekyll would have copied each one verbatim into the built site and served it as a
# raw download. **Enabling Pages would have published the entire work ledger.**
#
# Two independent instruments now hold the line, which is the right shape: one keeps the list
# current and one refuses the bad outcome.
#
#   * `tools/build-site.py` WRITES the block below from the directory itself, and `--check`
#     fails the battery the moment a new document appears unexcluded. A list nobody maintains
#     is how this got wrong in the first place.
#   * `tools/check-doc-conformance.py` MODELS what Jekyll would publish and refuses outright if
#     a ledger is in that set. It does not read this list and agree with it; it works out the
#     answer and fails on the answer. So a broken generator cannot produce a quiet pass.
#
# `tools/make-readable-html.py` renders TODO.html and NOW.html into outputs/readable/ as an
# internal reading convenience, and that is all it is for. It shares no output directory with
# the site.
include:
  - wiki

exclude:
  # BEGIN GENERATED EXCLUDE LIST -- written by tools/build-site.py.
  #
  # Jekyll publishes every entry in its source directory that it is not told to
  # exclude. This list named four directories until 0.12.93-dev -- two of which
  # (evidence, reviews) do not exist -- while fifty-four documents sat at docs/ root,
  # TODO.md and NOW.md among them. Enabling Pages would have published the whole work
  # ledger. The owner's rule is that it is never published, so the rule is now a list
  # that cannot fall behind the directory: `tools/build-site.py --check` fails the
  # battery when a new document appears and is not named here.
  #
  # Explicit names, never globs: Jekyll's exact-name and directory-prefix rules behave
  # identically in every version, and a glob that silently fails to exclude is the one
  # failure mode a ledger guard must not have.
  - ADMIN-ONBOARDING.md
  - AI_BUILD_HANDOFF.md
  - ALTERNATE_START_BRIEFS.md
  - ARCHITECTURE.md
  - BUILDING.md
  - CAMPAIGN_CHART.md
