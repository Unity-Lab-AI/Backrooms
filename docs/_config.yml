defaults:
  - scope:
      path: wiki
    values:
      layout: default

# A REAL DOMAIN IS SUPPORTED AND NOT YET NAMED.
#
# Owner: "a real domain, not a github.io path" / "a nice backrooms url". GitHub Pages reads a
# plain-text `CNAME` file in the published root, holding the bare hostname and nothing else.
#
# `CNAME.example` ships beside this file with the shape and the DNS records needed. **No file in
# this repository names a hostname the deploy does not have**, which is the rule the queue row
# sets: a document must not claim a URL that does not serve. When the owner has the domain,
# copy `CNAME.example` to `CNAME`, put the real hostname in it, point DNS at GitHub, and the row
# closes. Until then `github.io` is the address and nothing pretends otherwise.
